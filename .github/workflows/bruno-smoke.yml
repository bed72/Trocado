name: Bruno Smoke

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bruno-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/bruno-ci.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare disposable database
        run: |
          touch database/bruno-ci.sqlite
          php artisan migrate --force

      - name: Start application
        run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/trocado-bruno.log 2>&1 &

      - name: Wait for health check
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          cat /tmp/trocado-bruno.log
          exit 1

      - name: Run serial Bruno smoke suite
        uses: usebruno/bruno-cli-action@v1.0.0
        with:
          bru-version: '4.1.0'
          working-directory: bruno
          command: >-
            run -r
            --env CI
            --tags smoke
            --bail
            --reporter-json ../bruno-smoke-report.json
            --reporter-skip-all-headers
            --reporter-skip-body

      - name: Upload sanitized Bruno report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bruno-smoke-report
          path: bruno-smoke-report.json
          if-no-files-found: error
