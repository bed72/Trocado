domains:
  - trocado
php_version: "8.5"
node_version: "22"
framework: laravel
framework_version: "13"
secured: true
services:
  - mailpit
  - postgres
  - redis
workers:
  - expense-classification
  - queue
  - schedule
  - vite
custom_workers:
  expense-classification:
    label: Expense Classification Queue
    command: php artisan queue:work redis --queue=expense-classification --tries=3 --timeout=60 --sleep=1
    restart: always
    check:
      composer: laravel/ai
worker_options:
  queue:
    queue: default
