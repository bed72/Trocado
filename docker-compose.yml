x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: trocado-php:local
  env_file:
    - .env
  environment:
    NIGHTWATCH_INGEST_URI: nightwatch-agent:2407
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  networks:
    - default
    - dokploy-network

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: trocado-nginx:local
    restart: unless-stopped
    networks:
      - dokploy-network
      - fastcgi
    depends_on:
      migrate:
        condition: service_completed_successfully
      fpm:
        condition: service_started
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--connect-timeout", "2", "--max-time", "4", "--output", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  fpm:
    <<: *app
    environment:
      NIGHTWATCH_INGEST_URI: nightwatch-agent:2407
      FPM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-4}
      FPM_START_SERVERS: ${FPM_START_SERVERS:-2}
      FPM_MIN_SPARE_SERVERS: ${FPM_MIN_SPARE_SERVERS:-1}
      FPM_MAX_SPARE_SERVERS: ${FPM_MAX_SPARE_SERVERS:-2}
      FPM_MAX_REQUESTS: ${FPM_MAX_REQUESTS:-500}
      FPM_REQUEST_TERMINATE_TIMEOUT: ${FPM_REQUEST_TERMINATE_TIMEOUT:-60}
    networks:
      fastcgi:
        aliases:
          - fpm-fastcgi
      default:
      dokploy-network:
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    <<: *app
    user: www-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3", "--timeout=60", "--sleep=1"]

  expense-classification:
    <<: *app
    user: www-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "queue:work", "redis", "--queue=expense-classification", "--tries=3", "--timeout=60", "--sleep=1"]

  scheduler:
    <<: *app
    user: www-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "schedule:work"]

  nightwatch-agent:
    <<: *app
    user: www-data
    networks:
      - default
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "nightwatch:agent", "--listen-on=0.0.0.0:2407"]
    healthcheck:
      test: ["CMD", "php", "artisan", "nightwatch:status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  app-storage:

networks:
  dokploy-network:
    external: true
  fastcgi:
    internal: true
  default:
