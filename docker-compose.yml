x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: trocado-app:local
  env_file:
    - .env
  environment:
    NIGHTWATCH_INGEST_URI: nightwatch-agent:2407
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  networks:
    - dokploy-network
    - nightwatch-network

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  queue:
    <<: *app
    user: www-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3", "--timeout=60", "--sleep=1"]

  expense-classification:
    <<: *app
    user: www-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "queue:work", "redis", "--queue=expense-classification", "--tries=3", "--timeout=60", "--sleep=1"]

  scheduler:
    <<: *app
    user: www-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "schedule:work"]

  nightwatch-agent:
    <<: *app
    user: www-data
    networks:
      - nightwatch-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["php", "artisan", "nightwatch:agent", "--listen-on=0.0.0.0:2407"]
    healthcheck:
      test: ["CMD", "php", "artisan", "nightwatch:status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  app-storage:

networks:
  dokploy-network:
    external: true
  nightwatch-network:
