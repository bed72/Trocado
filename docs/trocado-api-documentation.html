    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: Trocado API\n  version: 1.0.0\nconfig:\n  environments:\n    - name: CI\n      variables:\n        - name: baseUrl\n          value: http://127.0.0.1:8000\n          description: Loopback URL used by the disposable CI application\nitems:\n  - info:\n      name: 00 - System\n      type: folder\n    docs:\n      content: |-\n        # System\n\n        Verifica se a aplicação está disponível antes dos cenários funcionais.\n\n        Execute `Health Check` primeiro. A pasta é somente leitura, não exige setup e não produz dados para cleanup. O endpoint `/up` usa JSON comum, não um documento JSON:API.\n      type: text/markdown\n    items:\n      - info:\n          name: Health Check\n          type: http\n          seq: 1\n          tags:\n            - smoke\n            - system\n        http:\n          method: GET\n          url: '{{baseUrl}}/up'\n          headers:\n            - name: Accept\n              value: application/json\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns HTTP 200\", function () {\n                  expect(res.getStatus()).to.equal(200);\n                });\n\n                test(\"reports the application as up\", function () {\n                  expect(res.getBody()).to.deep.equal({ status: \"up\" });\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n  - info:\n      name: Authentication\n      type: folder\n    request:\n      auth:\n        type: bearer\n        token: '{{authenticationToken}}'\n    docs:\n      content: |-\n        # Authentication\n\n        Demonstra o ciclo completo de uma sessão Bearer, incluindo conflito de cadastro, credenciais inválidas e revogação observável.\n\n        Execute os requests serialmente na ordem exibida:\n\n        1. `Sign Up` cria o usuário usado pelo cenário.\n        2. `Duplicate Sign Up`, `Invalid Sign Up`, `Invalid Sign In` e `Invalid Sign In Document` verificam conflito, credenciais e validação.\n        3. `Sign In` captura o token como variável de runtime.\n        4. `Sign Out` herda o Bearer da pasta, comprova a autenticação e revoga a sessão atual.\n        5. `Reject Revoked Token` reutiliza o token para comprovar a resposta `401` e remove a variável.\n        6. `Cleanup User` exclui o usuário criado no setup.\n\n        O fluxo cria e exclui dados. Use apenas destinos de desenvolvimento ou bancos descartáveis. Se ele parar antes do último request, execute `Cleanup User` antes de repetir. Nunca substitua as variáveis do fluxo por uma credencial ou token real versionado.\n      type: text/markdown\n    items:\n      - info:\n          name: Sign Up\n          type: http\n          seq: 1\n          tags:\n            - smoke\n            - authentication\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/authentication/sign-up'\n          headers:\n            - name: Content-Type\n              value: application/vnd.api+json\n          body:\n            type: json\n            data: |-\n              {\n                \"data\": {\n                  \"type\": \"sign-ups\",\n                  \"attributes\": {\n                    \"name\": \"Authentication Bruno\",\n                    \"email\": \"{{authenticationEmail}}\",\n                    \"password\": \"{{authenticationPassword}}\",\n                    \"password_confirmation\": \"{{authenticationPassword}}\"\n                  }\n                }\n              }\n        runtime:\n          scripts:\n            - type: before-request\n              code: |-\n                if (!bru.getVar(\"authenticationEmail\")) {\n                  const runId = `${Date.now()}${Math.floor(Math.random() * 1000000).toString().padStart(6, \"0\")}`;\n\n                  bru.setVar(\"authenticationEmail\", `authentication.bruno.${runId}@example.com`);\n                  bru.setVar(\"authenticationPassword\", `B${runId.slice(-8)}x`);\n                  bru.setVar(\"authenticationInvalidPassword\", `C${runId.slice(-8)}y`);\n                }\n            - type: after-response\n              code: |-\n                if (res.getStatus() === 201) {\n                  bru.setVar(\"authenticationUserId\", res.getBody().data.relationships.user.data.id);\n                }\n            - type: tests\n              code: |-\n                test(\"does not inherit Bearer on a public request\", function () {\n                  const authorization = req.headers.authorization ?? req.headers.Authorization;\n\n                  expect(authorization).to.equal(undefined);\n                });\n\n                test(\"returns HTTP 201 without a token\", function () {\n                  const body = res.getBody();\n\n                  expect(res.getStatus()).to.equal(201);\n                  expect(body.data.type).to.equal(\"sign-ups\");\n                  expect(JSON.stringify(body)).not.to.contain(\"token\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Duplicate Sign Up\n          type: http\n          seq: 2\n          tags:\n            - authentication\n            - conflict\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/authentication/sign-up'\n          headers:\n            - name: Content-Type\n              value: application/vnd.api+json\n          body:\n            type: json\n            data: |-\n              {\n                \"data\": {\n                  \"type\": \"sign-ups\",\n                  \"attributes\": {\n                    \"name\": \"Duplicate Authentication Bruno\",\n                    \"email\": \"{{authenticationEmail}}\",\n                    \"password\": \"{{authenticationPassword}}\",\n                    \"password_confirmation\": \"{{authenticationPassword}}\"\n                  }\n                }\n              }\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns the JSON:API email conflict\", function () {\n                  expect(res.getStatus()).to.equal(409);\n                  expect(res.getBody().errors[0].source.pointer).to.equal(\"/data/attributes/email\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Invalid Sign Up\n          type: http\n          seq: 3\n          tags:\n            - authentication\n            - validation\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/authentication/sign-up'\n          headers:\n            - name: Content-Type\n              value: application/vnd.api+json\n          body:\n            type: json\n            data: |-\n              {\n                \"data\": {\n                  \"type\": \"sign-ups\",\n                  \"attributes\": {\n                    \"name\": \"Invalid Authentication Bruno\",\n                    \"email\": \"{{authenticationEmail}}\",\n                    \"password\": \"{{authenticationPassword}}\"\n                  }\n                }\n              }\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"rejects a sign up without password confirmation\", function () {\n                  const error = res.getBody().errors[0];\n\n                  expect(res.getStatus()).to.equal(422);\n                  expect(error.source.pointer).to.equal(\"/data/attributes/password_confirmation\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Invalid Sign In\n          type: http\n          seq: 4\n          tags:\n            - authentication\n            - invalid-credentials\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/authentication/sign-in'\n          headers:\n            - name: Content-Type\n              value: application/vnd.api+json\n          body:\n            type: json\n            data: |-\n              {\n                \"data\": {\n                  \"type\": \"access-tokens\",\n                  \"attributes\": {\n                    \"email\": \"{{authenticationEmail}}\",\n                    \"password\": \"{{authenticationInvalidPassword}}\"\n                  }\n                }\n              }\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"returns generic invalid credentials\", function () {\n                  expect(res.getStatus()).to.equal(401);\n                  expect(res.getBody().errors[0].detail).to.equal(\"As credenciais informadas são inválidas.\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Invalid Sign In Document\n          type: http\n          seq: 5\n          tags:\n            - authentication\n            - validation\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/authentication/sign-in'\n          headers:\n            - name: Content-Type\n              value: application/vnd.api+json\n          body:\n            type: json\n            data: |-\n              {\n                \"data\": {\n                  \"type\": \"access-tokens\",\n                  \"attributes\": {\n                    \"email\": \"{{authenticationEmail}}\"\n                  }\n                }\n              }\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"rejects a sign in without password\", function () {\n                  const error = res.getBody().errors[0];\n\n                  expect(res.getStatus()).to.equal(422);\n                  expect(error.source.pointer).to.equal(\"/data/attributes/password\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Sign In\n          type: http\n          seq: 6\n          tags:\n            - smoke\n            - authentication\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/authentication/sign-in'\n          headers:\n            - name: Content-Type\n              value: application/vnd.api+json\n          body:\n            type: json\n            data: |-\n              {\n                \"data\": {\n                  \"type\": \"access-tokens\",\n                  \"attributes\": {\n                    \"email\": \"{{authenticationEmail}}\",\n                    \"password\": \"{{authenticationPassword}}\"\n                  }\n                }\n              }\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.getStatus() === 200) {\n                  bru.setVar(\"authenticationToken\", res.getBody().data.attributes.token);\n                }\n            - type: tests\n              code: |-\n                test(\"returns a Bearer token without cache\", function () {\n                  const body = res.getBody();\n\n                  expect(res.getStatus()).to.equal(200);\n                  expect(body.data.type).to.equal(\"access-tokens\");\n                  expect(body.data.attributes.token).to.be.a(\"string\").and.not.be.empty;\n                  expect(body.data.attributes.token_type).to.equal(\"Bearer\");\n                  expect(body.data.attributes.expires_at).to.be.a(\"string\").and.not.be.empty;\n                  expect(body.data.relationships.user.data.id).to.equal(bru.getVar(\"authenticationUserId\"));\n                  expect(res.getHeader(\"cache-control\")).to.contain(\"no-store\");\n                  expect(res.getHeader(\"pragma\")).to.contain(\"no-cache\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n        docs: A resposta expõe o token Bearer somente neste login. O script pós-resposta o mantém como variável de runtime `authenticationToken` para os requests seguintes; não copie o valor para a collection, para um ambiente ou para documentação.\n      - info:\n          name: Sign Out\n          type: http\n          seq: 7\n          tags:\n            - smoke\n            - authentication\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/authentication/sign-out'\n          auth: inherit\n        runtime:\n          scripts:\n            - type: tests\n              code: |-\n                test(\"inherits JSON:API negotiation without a content type\", function () {\n                  const accept = req.headers.accept ?? req.headers.Accept;\n                  const contentType = req.headers[\"content-type\"] ?? req.headers[\"Content-Type\"];\n\n                  expect(accept).to.equal(\"application/vnd.api+json\");\n                  expect(contentType).to.equal(undefined);\n                });\n\n                test(\"inherits the runtime Bearer token\", function () {\n                  const token = bru.getVar(\"authenticationToken\");\n                  const authorization = req.headers.authorization ?? req.headers.Authorization;\n\n                  expect(token).to.be.a(\"string\").and.not.be.empty;\n                  expect(authorization?.startsWith(\"Bearer \")).to.equal(true);\n                  expect(authorization?.slice(7) === token).to.equal(true);\n                });\n\n                test(\"revokes the current token\", function () {\n                  expect(res.getStatus()).to.equal(204);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Reject Revoked Token\n          type: http\n          seq: 8\n          tags:\n            - smoke\n            - authentication\n            - revoked-token\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/authentication/sign-out'\n          auth: inherit\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.getStatus() === 401) {\n                  bru.deleteVar(\"authenticationToken\");\n                }\n            - type: tests\n              code: |-\n                test(\"rejects the revoked token\", function () {\n                  expect(res.getStatus()).to.equal(401);\n                  expect(res.getHeader(\"content-type\")).to.contain(\"application/vnd.api+json\");\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n      - info:\n          name: Cleanup User\n          type: http\n          seq: 9\n          tags:\n            - smoke\n            - authentication\n            - cleanup\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/users/{{authenticationUserId}}'\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                if (res.getStatus() === 204) {\n                  bru.deleteVar(\"authenticationUserId\");\n                  bru.deleteVar(\"authenticationToken\");\n                  bru.deleteVar(\"authenticationEmail\");\n                  bru.deleteVar(\"authenticationPassword\");\n                  bru.deleteVar(\"authenticationInvalidPassword\");\n                }\n            - type: tests\n              code: |-\n                test(\"removes the sign up user\", function () {\n                  expect(res.getStatus()).to.equal(204);\n                });\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: true\n  - info:\n      name: Budget\n      type: folder\n    docs:\n      content: |-\n        # Budget\n\n        Exercita CRUD, regras de validação e respostas not-found do recurso Budget. Valores de `amount` são inteiros em centavos.\n\n        Cada subpasta é um cenário serial independente. Em `01 - CRUD`, `Create Budget` faz o setup e os dois últimos requests excluem e confirmam a exclusão. Em `02 - Validation/02 - Update`, execute `Setup Budget` antes das validações e `Cleanup Budget` ao final. As validações de create e `03 - Not Found` não persistem recursos quando respondem conforme esperado.\n\n        Os fluxos com setup alteram o banco. Use um destino de desenvolvimento ou descartável e conclua o cleanup indicado se a execução for interrompida.\n      type: text/markdown\n    items:\n      - info:\n          name: 01 - CRUD\n          type: folder\n        items:\n          - info:\n              name: Create Budget\n              type: http\n              seq: 1\n              tags:\n                - budget\n                - crud\n            http:\n              method: POST\n              url: '{{baseUrl}}/api/budgets'\n              headers:\n                - name: Content-Type\n                  value: application/vnd.api+json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"type\": \"budgets\",\n                      \"attributes\": {\n                        \"amount\": 12500,\n                        \"start_date\": \"2026-09-01\",\n                        \"end_date\": \"2026-09-30\"\n                      }\n                    }\n                  }\n            runtime:\n              scripts:\n                - type: after-response\n                  code: |-\n                    if (res.getStatus() === 201) {\n                      bru.setVar(\"budgetId\", res.getBody().data.id);\n                    }\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 201\", function () {\n                      expect(res.getStatus()).to.equal(201);\n                    });\n\n                    test(\"returns a JSON:API budget resource\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.type).to.equal(\"budgets\");\n                      expect(body.data.id).to.be.a(\"string\").and.not.be.empty;\n                      expect(body.data.attributes.amount).to.equal(12500);\n                    });\n\n                    test(\"returns JSON:API and Location headers\", function () {\n                      expect(res.getHeader(\"content-type\")).to.contain(\"application/vnd.api+json\");\n                      expect(res.getHeader(\"location\")).to.contain(\"/api/budgets/\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Get Budget\n              type: http\n              seq: 2\n              tags:\n                - budget\n                - crud\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/budgets/{{budgetId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"returns the budget created by the previous request\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.type).to.equal(\"budgets\");\n                      expect(body.data.id).to.equal(String(bru.getVar(\"budgetId\")));\n                      expect(body.data.attributes.amount).to.equal(12500);\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Update Budget\n              type: http\n              seq: 3\n              tags:\n                - budget\n                - crud\n            http:\n              method: PATCH\n              url: '{{baseUrl}}/api/budgets/{{budgetId}}'\n              headers:\n                - name: Content-Type\n                  value: application/vnd.api+json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"type\": \"budgets\",\n                      \"id\": \"{{budgetId}}\",\n                      \"attributes\": {\n                        \"amount\": 15000,\n                        \"start_date\": \"2026-10-01\",\n                        \"end_date\": \"2026-10-31\"\n                      }\n                    }\n                  }\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"returns the updated budget\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.id).to.equal(String(bru.getVar(\"budgetId\")));\n                      expect(body.data.attributes.amount).to.equal(15000);\n                      expect(body.data.attributes.start_date).to.equal(\"2026-10-01\");\n                      expect(body.data.attributes.end_date).to.equal(\"2026-10-31\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: List Budgets\n              type: http\n              seq: 4\n              tags:\n                - budget\n                - crud\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/budgets'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"returns a JSON:API resource collection\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data).to.be.an(\"array\");\n                      expect(body.data.some((budget) => budget.id === String(bru.getVar(\"budgetId\")))).to.be.true;\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Delete Budget\n              type: http\n              seq: 5\n              tags:\n                - budget\n                - crud\n            http:\n              method: DELETE\n              url: '{{baseUrl}}/api/budgets/{{budgetId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 204\", function () {\n                      expect(res.getStatus()).to.equal(204);\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Confirm Budget Deletion\n              type: http\n              seq: 6\n              tags:\n                - budget\n                - crud\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/budgets/{{budgetId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 404\", function () {\n                      expect(res.getStatus()).to.equal(404);\n                    });\n\n                    test(\"returns the domain not-found error\", function () {\n                      const error = res.getBody().errors[0];\n\n                      expect(error.status).to.equal(\"404\");\n                      expect(error.title).to.equal(\"Budget n\\u00e3o encontrado\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n      - info:\n          name: 02 - Validation\n          type: folder\n        items:\n          - info:\n              name: 01 - Create\n              type: folder\n            items:\n              - info:\n                  name: Create - Wrong Resource Type\n                  type: http\n                  seq: 1\n                  tags:\n                    - budget\n                    - validation\n                http:\n                  method: POST\n                  url: '{{baseUrl}}/api/budgets'\n                  headers:\n                    - name: Content-Type\n                      value: application/vnd.api+json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"data\": {\n                          \"type\": \"expenses\",\n                          \"attributes\": {\n                            \"amount\": 12500,\n                            \"start_date\": \"2026-09-01\",\n                            \"end_date\": \"2026-09-30\"\n                          }\n                        }\n                      }\n                runtime:\n                  scripts:\n                    - type: tests\n                      code: |-\n                        test(\"returns HTTP 422\", function () {\n                          expect(res.getStatus()).to.equal(422);\n                        });\n\n                        test(\"points to the resource type\", function () {\n                          expect(res.getBody().errors[0].source.pointer).to.equal(\"/data/type\");\n                        });\n                settings:\n                  encodeUrl: true\n                  timeout: 0\n                  followRedirects: true\n                  maxRedirects: 5\n                  forwardAuthorizationHeader: true\n              - info:\n                  name: Create - Missing Amount\n                  type: http\n                  seq: 2\n                  tags:\n                    - budget\n                    - validation\n                http:\n                  method: POST\n                  url: '{{baseUrl}}/api/budgets'\n                  headers:\n                    - name: Content-Type\n                      value: application/vnd.api+json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"data\": {\n                          \"type\": \"budgets\",\ n                  code: |-\n                    test(\"returns HTTP 404\", function () {\n                      expect(res.getStatus()).to.equal(404);\n                    });\n\n                    test(\"returns the domain not-found error\", function () {\n                      expect(res.getBody().errors[0].title).to.equal(\"Budget n\\u00e3o encontrado\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n  - info:\n      name: Budget Recurrence\n      type: folder\n    docs:\n      content: |-\n        # Budget Recurrence\n\n        Exercita o ciclo de vida de recorrências de Budget, validações, conflitos de sobreposição, transições inválidas e respostas not-found. Valores de `amount` são inteiros em centavos.\n\n        Execute cada subpasta serialmente e em sua ordem interna:\n\n        - `01 - Lifecycle` cria Budget e recorrência, consulta e atualiza o template, encerra, comprova que a retomada é rejeitada e remove o Budget inicial.\n        - `02 - Validation/02 - Update` cria a recorrência de teste, executa as validações, encerra a recorrência e remove o Budget associado.\n        - `03 - Conflicts` cria um Budget conflitante, comprova que nenhuma recorrência sobreposta foi criada e remove o Budget.\n        - `04 - Invalid Transitions` cria uma recorrência ativa, demonstra transições rejeitadas, encerra a recorrência e remove o Budget.\n        - `05 - Not Found` não cria dados.\n\n        Esses cenários são mutáveis e alguns encerramentos são irreversíveis para a recorrência usada no fluxo. Use apenas desenvolvimento ou banco descartável. Após falha intermediária, execute o cleanup da mesma subpasta antes de repetir.\n      type: text/markdown\n    items:\n      - info:\n          name: 01 - Lifecycle\n          type: folder\n        items:\n          - info:\n              name: Create Recurring Budget\n              type: http\n              seq: 1\n              tags:\n                - budget-recurrence\n                - lifecycle\n            http:\n              method: POST\n              url: '{{baseUrl}}/api/budgets'\n              headers:\n                - name: Content-Type\n                  value: application/vnd.api+json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"type\": \"budgets\",\n                      \"attributes\": {\n                        \"amount\": 100000,\n                        \"start_date\": \"2030-01-01\",\n                        \"end_date\": \"2030-01-07\",\n                        \"recurring\": true\n                      }\n                    }\n                  }\n            runtime:\n              scripts:\n                - type: after-response\n                  code: |-\n                    if (res.getStatus() === 201) {\n                      const body = res.getBody();\n\n                      bru.setVar(\"recurringBudgetId\", body.data.id);\n                      bru.setVar(\"recurrenceId\", body.data.relationships.recurrence.data.id);\n                    }\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 201\", function () {\n                      expect(res.getStatus()).to.equal(201);\n                    });\n\n                    test(\"returns the recurring budget relationship\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.type).to.equal(\"budgets\");\n                      expect(body.data.id).to.be.a(\"string\").and.not.be.empty;\n                      expect(body.data.attributes.amount).to.equal(100000);\n                      expect(body.data.relationships.recurrence.data.type).to.equal(\"budget-recurrences\");\n                      expect(body.data.relationships.recurrence.data.id).to.be.a(\"string\").and.not.be.empty;\n                    });\n\n                    test(\"returns JSON:API and Location headers\", function () {\n                      expect(res.getHeader(\"content-type\")).to.contain(\"application/vnd.api+json\");\n                      expect(res.getHeader(\"location\")).to.contain(\"/api/budgets/\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Get Recurrence\n              type: http\n              seq: 2\n              tags:\n                - budget-recurrence\n                - lifecycle\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/budget-recurrences/{{recurrenceId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"returns the active recurrence template\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.type).to.equal(\"budget-recurrences\");\n                      expect(body.data.id).to.equal(String(bru.getVar(\"recurrenceId\")));\n                      expect(body.data.attributes.status).to.equal(\"active\");\n                      expect(body.data.attributes.amount).to.equal(100000);\n                      expect(body.data.attributes.duration_in_days).to.equal(7);\n                      expect(body.data.attributes.next_start_date).to.equal(\"2030-01-08\");\n                    });\n\n                    test(\"returns the JSON:API content type\", function () {\n                      expect(res.getHeader(\"content-type\")).to.contain(\"application/vnd.api+json\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Update Recurrence\n              type: http\n              seq: 3\n              tags:\n                - budget-recurrence\n                - lifecycle\n            http:\n              method: PATCH\n              url: '{{baseUrl}}/api/budget-recurrences/{{recurrenceId}}'\n              headers:\n                - name: Content-Type\n                  value: application/vnd.api+json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"type\": \"budget-recurrences\",\n                      \"id\": \"{{recurrenceId}}\",\n                      \"attributes\": {\n                        \"amount\": 125000,\n                        \"duration_in_days\": 10\n                      }\n                    }\n                  }\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"updates only the future template\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.id).to.equal(String(bru.getVar(\"recurrenceId\")));\n                      expect(body.data.attributes.status).to.equal(\"active\");\n                      expect(body.data.attributes.amount).to.equal(125000);\n                      expect(body.data.attributes.duration_in_days).to.equal(10);\n                      expect(body.data.attributes.next_start_date).to.equal(\"2030-01-08\");\n                    });\n            settings:\n              encodeUrl: true\n true\n          - info:\n              name: Delete Initial Budget\n              type: http\n              seq: 7\n              tags:\n                - budget-recurrence\n                - lifecycle\n                - cleanup\n            http:\n              method: DELETE\n              url: '{{baseUrl}}/api/budgets/{{recurringBudgetId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 204\", function () {\n                      expect(res.getStatus()).to.equal(204);\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Confirm Initial Budget Deletion\n              type: http\n              seq: 8\n              tags:\n                - budget-recurrence\n                - lifecycle\n                - cleanup\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/budgets/{{recurringBudgetId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 404\", function () {\n                      expect(res.getStatus()).to.equal(404);\n                    });\n\n                    test(\"returns the budget not-found error\", function () {\n                      expect(res.getBody().errors[0].title).to.equal(\"Budget n\\u00e3o encontrado\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n      - info:\n          name: 02 - Validation\n          type: folder\n        items:\n          - info:\n              name: 01 - Create\n              type: folder\n            items:\n    seq: 1\n              tags:\n                - user\n                - crud\n            http:\n              method: POST\n              url: '{{baseUrl}}/api/users'\n              headers:\n                - name: Content-Type\n                  value: application/vnd.api+json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"type\": \"users\",\n                      \"attributes\": {\n                        \"name\": \"  Maria Silva  \",\n                        \"email\": \"  BRUNO.USER.CRUD@EXAMPLE.COM  \"\n                      }\n                    }\n                  }\n            runtime:\n              scripts:\n                - type: after-response\n                  code: |-\n                    if (res.getStatus() === 201) {\n                      bru.setVar(\"userId\", res.getBody().data.id);\n                    }\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 201\", function () {\n                      expect(res.getStatus()).to.equal(201);\n                    });\n\n                    test(\"returns a canonical JSON:API user resource\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.type).to.equal(\"users\");\n                      expect(body.data.id).to.be.a(\"string\").and.not.be.empty;\n                      expect(body.data.attributes.name).to.equal(\"Maria Silva\");\n                      expect(body.data.attributes.email).to.equal(\"bruno.user.crud@example.com\");\n                      expect(body.data.attributes.created_at).to.be.a(\"string\");\n                      expect(body.data.attributes.updated_at).to.be.a(\"string\");\n                    });\n\n                    test(\"returns JSON:API and Location headers\", function () {\n                      expect(res.getHeader(\"content-type\")).to.contain(\"application/vnd.api+json\");\n                      expect(res.getHeader(\"location\")).to.contain(\"/api/users/\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Get User\n              type: http\n              seq: 2\n              tags:\n                - user\n                - crud\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/users/{{userId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"returns the user created by the previous request\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.type).to.equal(\"users\");\n                      expect(body.data.id).to.equal(String(bru.getVar(\"userId\")));\n                      expect(body.data.attributes.name).to.equal(\"Maria Silva\");\n                      expect(body.data.attributes.email).to.equal(\"bruno.user.crud@example.com\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Update User\n              type: http\n              seq: 3\n              tags:\n                - user\n                - crud\n            http:\n              method: PATCH\n              url: '{{baseUrl}}/api/users/{{userId}}'\n              headers:\n                - name: Content-Type\n                  value: application/vnd.api+json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"type\": \"users\",\n                      \"id\": \"{{userId}}\",\n                      \"attributes\": {\n                        \"name\": \"Maria Souza\",\n                        \"email\": \"MARIA.SOUZA@EXAMPLE.COM\"\n                      }\n                    }\n                  }\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"returns the canonical updated user\", function () {\n                      const body = res.getBody();\n\n                      expect(body.data.id).to.equal(String(bru.getVar(\"userId\")));\n                      expect(body.data.attributes.name).to.equal(\"Maria Souza\");\n                      expect(body.data.attributes.email).to.equal(\"maria.souza@example.com\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: List Users\n              type: http\n              seq: 4\n              tags:\n                - user\n                - crud\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/users'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 200\", function () {\n                      expect(res.getStatus()).to.equal(200);\n                    });\n\n                    test(\"returns a JSON:API resource collection containing the user\", function () {\n                      const body = res.getBody();\n                      const user = body.data.find((item) => item.id === String(bru.getVar(\"userId\")));\n\n                      expect(body.data).to.be.an(\"array\");\n                      expect(user).not.to.be.undefined;\n                      expect(user.attributes.email).to.equal(\"maria.souza@example.com\");\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Delete User\n              type: http\n              seq: 5\n              tags:\n                - user\n                - crud\n            http:\n              method: DELETE\n              url: '{{baseUrl}}/api/users/{{userId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 204\", function () {\n                      expect(res.getStatus()).to.equal(204);\n                    });\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n          - info:\n              name: Confirm User Deletion\n              type: http\n              seq: 6\n              tags:\n                - user\n                - crud\n            http:\n              method: GET\n              url: '{{baseUrl}}/api/users/{{userId}}'\n            runtime:\n              scripts:\n                - type: tests\n                  code: |-\n                    test(\"returns HTTP 404\", function () {\n                      expect(res.getStatus()).to.equal(404);\n                    });\n\n                    test(\"returns the user not-found error\", function () {\n                      const error = res.getBody().errors[0];\n\n                      expect(error.status).to.equal(\"404\");\n                      expect(error.title).to.equal(\"User n  Execute a aplicação e as migrations em um banco apropriado para testes.\n    - Selecione um ambiente Bruno antes de enviar requests. No ambiente `Local`, `baseUrl` aponta para a aplicação servida pelo Lerd.\n    - Não execute cenários mutáveis ou destrutivos contra produção ou banco compartilhado.\n\n    ## JSON:API\n\n    Os endpoints em `/api` usam `application/vnd.api+json`. Requests com documento JSON:API enviam `Content-Type` explicitamente; requests sem body não precisam desse header. Recursos usam IDs em formato string e respostas de erro usam o membro `errors`.\n\n    O endpoint de health `/up` é uma exceção operacional e responde JSON comum.\n\n    ## Valores monetários\n\n    O atributo `amount` é um inteiro em centavos. Por exemplo, `125000` representa 1.250,00 na moeda apresentada pelo aplicativo consumidor. Não envie valores decimais nesse campo.\n\n    ## Ambientes e variáveis\n\n    `baseUrl` identifica o destino selecionado. Os IDs reservados para not-found são fixtures estáveis e não identificam recursos do destino. IDs e dados produzidos por requests de setup são variáveis de runtime e valem apenas durante a execução. Credenciais e tokens reais não devem ser gravados na collection ou em ambientes versionados.\n\n    ## Autenticação\n\n    Execute a pasta `Authentication` em ordem. O login captura o token Bearer como variável de runtime; somente requests protegidos o enviam. O logout revoga a sessão e o cenário seguinte comprova que o mesmo token deixou de ser aceito.\n\n    ## Execução segura\n\n    Execute pastas e requests em ordem crescente de `seq`. Os cenários compartilham variáveis de runtime, criam, alteram e removem dados, portanto a execução deve ser serial. Cada pasta informa seus passos de setup e cleanup; se uma execução falhar no meio, faça o cleanup indicado antes de repetir o fluxo.\n\n    ## Referência HTML\n\n    A referência compartilhável é `docs/trocado-api-documentation.html`, gerada com Bruno Desktop 4.1.0 e somente o ambiente `CI`:\n\n    1. Abra `Collection Settings > Documentation > Generate Docs`.\n    2. Selecione somente o ambiente `CI` e gere o arquivo.\n    3. Mova o resultado para `docs/trocado-api-documentation.html`.\n\n    Regere o arquivo após alterar requests ou documentação. O HTML é derivado desta collection, não deve ser editado manualmente e não substitui OpenSpec.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-09-21T20:49:07.989Z'\n    exportedUsing: Bruno/4.1.0\n";
