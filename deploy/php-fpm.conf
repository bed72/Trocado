; Overrides the official image's pool after www.conf, docker.conf and zz-docker.conf.
[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
; This alias exists only on the dedicated FastCGI network, not the service network.
listen = fpm-fastcgi:9000
listen.backlog = 128
clear_env = no
chdir = /var/www/html
security.limit_extensions = .php

; Provisional limits, not a measured production memory/connection budget.
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${FPM_MAX_REQUESTS}
request_terminate_timeout = ${FPM_REQUEST_TERMINATE_TIMEOUT}s
request_terminate_timeout_track_finished = yes

catch_workers_output = yes
decorate_workers_output = no
; Do not inherit the official access format, which includes user/URI metadata.
access.log = /proc/self/fd/2
access.format = "%t %m %s %{milliseconds}d %{kilobytes}M"
