# Access metadata only: no URI, query string, referer, cookies or credentials.
log_format trocado '$time_iso8601 $remote_addr $request_method $status $body_bytes_sent $request_time';

# Docker's embedded DNS; re-resolve the upstream after an FPM container replacement.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream trocado_fpm {
    zone trocado_fpm 64k;
    server fpm-fastcgi:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    server_tokens off;
    autoindex off;
    charset utf-8;
    absolute_redirect off;

    access_log /dev/stdout trocado;
    # Nginx error logs cannot redact signed query strings. Use access status/timing
    # and PHP/application logs; do not enable per-request error logs in production.
    error_log /dev/null;

    add_header Strict-Transport-Security "max-age=15552000" always;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/vnd.api+json application/xml image/svg+xml;

    location ~ /\. {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_XSRF_TOKEN $http_x_xsrf_token;
        fastcgi_pass_request_headers on;
        # REMOTE_ADDR from fastcgi_params is the Traefik peer, not Nginx's IP.
        # Forwarded headers pass unchanged; trust is restricted in PHP/Traefik.
        fastcgi_pass trocado_fpm;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 65s;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Strict-Transport-Security;
    }

    location ~* \.php {
        return 404;
    }

    location / {
        # Match Apache's non-directory trailing-slash redirect, retaining args.
        if (!-d $request_filename) {
            rewrite ^(.+)/$ $1 permanent;
        }
        try_files $uri /index.php$is_args$args;
    }
}
