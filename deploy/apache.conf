<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/vnd.api+json application/xml image/svg+xml

    Header always set Strict-Transport-Security "max-age=15552000"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
